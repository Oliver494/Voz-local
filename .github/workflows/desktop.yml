name: Desktop preview
on:
  push:
    branches: [desktop-app]
  workflow_dispatch:
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            bundles: deb,appimage
          - os: windows-latest
            platform: windows
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev librsvg2-dev patchelf libfuse2t64 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: npm ci
      - name: Prepare pinned bundled resources
        run: python scripts/desktop/prepare_resources.py --platform ${{ matrix.platform }}
      - run: node scripts/build-frontend.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: python -m pip install fastapi==0.141.1 uvicorn==0.54.0 httpx==0.28.1 python-multipart==0.0.32 soundfile numpy
      - run: python -m unittest discover -s tests -v
        env:
          VOZ_LOCAL_FFMPEG: ${{ github.workspace }}/src-tauri/resources/tools/ffmpeg${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Create desktop installers
        env:
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - name: Windows native UI, private engine and media smoke
        if: runner.os == 'Windows'
        id: native-smoke
        continue-on-error: true
        timeout-minutes: 4
        shell: pwsh
        run: |
          $data = Join-Path $env:LOCALAPPDATA 'com.oliver494.vozlocal'
          python scripts/desktop/create_smoke_fixture.py --data "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create isolated native fixture' }
          python -m venv --system-site-packages (Join-Path $data 'environment')
          Copy-Item src-tauri/resources src-tauri/target/release/resources -Recurse -Force
          New-Item -ItemType Directory -Force .build-deps | Out-Null
          $stdout = Join-Path $PWD '.build-deps/native-windows.log'
          $stderr = Join-Path $PWD '.build-deps/native-windows-errors.log'
          $process = Start-Process -FilePath (Join-Path $PWD 'src-tauri/target/release/voz-local.exe') -ArgumentList '--smoke-media' -PassThru -RedirectStandardOutput "$stdout" -RedirectStandardError "$stderr"
          $handle = $process.Handle
          if (-not $process.WaitForExit(150000)) { Stop-Process -Id $process.Id -Force; throw 'Native UI smoke timed out' }
          Get-Content "$stdout", "$stderr"
          Get-ChildItem (Join-Path $data 'logs/*.log') | ForEach-Object { Write-Output $_.Name; Get-Content $_.FullName }
          if ($process.ExitCode -ne 0) { throw "Native UI smoke failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: windows-native-smoke-logs
          path: .build-deps/native-windows*.log
      - name: Record native smoke status
        if: runner.os == 'Windows' && always()
        shell: bash
        run: echo 'Windows native UI/media smoke — ${{ steps.native-smoke.outcome }}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: voz-local-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create or update draft preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.2.0 --draft --prerelease --target "$GITHUB_SHA" --title 'Voz Local Desktop v0.2.0 — Preview' --notes-file docs/desktop-release.md
          else
            if [ "$(gh release view v0.2.0 --json isDraft --jq .isDraft)" != true ]; then
              echo 'v0.2.0 is already published; bump the desktop version instead of replacing published assets.' >&2
              exit 1
            fi
            gh release edit v0.2.0 --target "$GITHUB_SHA" --notes-file docs/desktop-release.md
          fi
          find installers -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print0 | xargs -0 -r gh release upload v0.2.0 --clobber
